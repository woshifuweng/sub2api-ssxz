[Unit]
Requires=redis-staging.service
After=redis-staging.service

[Service]
Environment="REDIS_HOST=127.0.0.1"
Environment="REDIS_PORT=6380"
Environment="REDIS_DB=0"
Environment="APP_RUNTIME_ROLE=staging"
Environment="BACKGROUND_JOBS_ENABLED=false"

# Passive staging may access only local PostgreSQL/Redis and its loopback HTTP port.
# This blocks SMTP, provider refreshes, probes, webhooks, backups, and other egress.
IPAddressDeny=any
IPAddressAllow=localhost
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
